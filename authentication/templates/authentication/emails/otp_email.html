<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کد تأیید ورود به داشبورد</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f6f9; font-family:Tahoma, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f6f9; padding:24px 12px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; background-color:#ffffff; border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,0.06); overflow:hidden;">
                    <tr>
                        <td style="padding:40px 28px 32px; text-align:center;">
                            <h2 style="margin:0 0 20px; color:#1a1a2e; font-size:24px; font-weight:bold;">کد تأیید ورود به داشبورد</h2>
                            <p style="margin:0 0 24px; color:#4a4a4a; font-size:16px; line-height:1.8;">
                                {{ user }} عزیز،
                            </p>
                            <p style="margin:0 0 20px; color:#4a4a4a; font-size:15px; line-height:1.8;">
                                کد تأیید یک‌بارمصرف شما برای ورود به داشبورد:
                            </p>
                            <div style="background-color:#f0f4ff; border:1px solid #d0dbff; border-radius:12px; padding:18px 12px; margin:0 auto 28px; max-width:320px;">
                                <span style="font-size:36px; font-weight:bold; letter-spacing:10px; color:#0d6efd;">{{ otp }}</span>
                            </div>
                            <p style="margin:0 0 8px; color:#4a4a4a; font-size:14px;">
                                این کد تا <strong>۲ دقیقه</strong> معتبر است.
                            </p>
                            <p style="margin:0; color:#c0392b; font-size:13px;">
                                لطفاً این کد را با دیگران به اشتراک نگذارید.
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="background-color:#fafafa; padding:16px 24px; text-align:center; color:#888888; font-size:12px;">
                            این پیام به‌صورت خودکار ارسال شده است. لطفاً پاسخ ندهید.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
