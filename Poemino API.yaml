openapi: 3.0.3
info:
  title: Poemino API
  version: 1.0.0
  description: API Documentation
paths:
  /api/Accounts/:
    get:
      operationId: api_Accounts_list
      parameters:
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomUserList'
          description: ''
    post:
      operationId: api_Accounts_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomUser'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomUser'
          description: ''
  /api/Accounts/{id}/:
    get:
      operationId: api_Accounts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این کاربر را شناسایی میکند.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomUser'
          description: ''
    put:
      operationId: api_Accounts_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این کاربر را شناسایی میکند.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomUser'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomUser'
          description: ''
    patch:
      operationId: api_Accounts_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این کاربر را شناسایی میکند.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomUser'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomUser'
          description: ''
    delete:
      operationId: api_Accounts_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این کاربر را شناسایی میکند.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/Poems/:
    get:
      operationId: api_Poems_list
      parameters:
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      - in: query
        name: poem_type
        schema:
          type: string
          title: نوع شعر
          enum:
          - ghasideh
          - ghazal
          - masnavi
          - nimaee
          - robaee
          - sepid
        description: |-
          * `ghazal` - غزل
          * `masnavi` - مثنوی
          * `robaee` - رباعی
          * `ghasideh` - قصیده
          * `nimaee` - نیمایی
          * `sepid` - سپید
      - name: search
        required: false
        in: query
        description: یک عبارت جستجو.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          title: وضعیت
          enum:
          - a
          - r
          - w
        description: |-
          * `w` - در انتظار تأیید
          * `a` - تایید شده
          * `r` - ردشده
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCreatePoemList'
          description: ''
    post:
      operationId: api_Poems_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePoem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreatePoem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreatePoem'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePoem'
          description: ''
  /api/Poems/{id}/:
    get:
      operationId: api_Poems_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این creat pom را شناسایی میکند.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePoem'
          description: ''
    put:
      operationId: api_Poems_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این creat pom را شناسایی میکند.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePoem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreatePoem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreatePoem'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePoem'
          description: ''
    patch:
      operationId: api_Poems_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این creat pom را شناسایی میکند.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCreatePoem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCreatePoem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCreatePoem'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePoem'
          description: ''
    delete:
      operationId: api_Poems_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این creat pom را شناسایی میکند.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/token/:
    post:
      operationId: api_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/refresh/:
    post:
      operationId: api_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
components:
  schemas:
    Author:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          title: 'نام '
          maxLength: 150
        last_name:
          type: string
          title: نام خانوادگی
          maxLength: 150
        email:
          nullable: true
          title: آدرس ایمیل
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
      required:
      - id
    BlankEnum:
      enum:
      - ''
    CreatePoem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: نام شعر
          maxLength: 150
        text:
          type: string
          title: نمایش متن شعر
        voies:
          type: string
          format: uri
          title: آوای شعر
        author:
          allOf:
          - $ref: '#/components/schemas/Author'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
          title: وضعیت
        poem_type:
          title: نوع شعر
          oneOf:
          - $ref: '#/components/schemas/PoemTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
      required:
      - author
      - id
      - name
      - status
      - text
      - voies
    CustomUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: نام کاربری
          maxLength: 150
        first_name:
          type: string
          title: 'نام '
          maxLength: 150
        last_name:
          type: string
          title: نام خانوادگی
          maxLength: 150
        email:
          nullable: true
          title: آدرس ایمیل
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
      required:
      - id
      - username
    PaginatedCreatePoemList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CreatePoem'
    PaginatedCustomUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CustomUser'
    PatchedCreatePoem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: نام شعر
          maxLength: 150
        text:
          type: string
          title: نمایش متن شعر
        voies:
          type: string
          format: uri
          title: آوای شعر
        author:
          allOf:
          - $ref: '#/components/schemas/Author'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
          title: وضعیت
        poem_type:
          title: نوع شعر
          oneOf:
          - $ref: '#/components/schemas/PoemTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
    PatchedCustomUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: نام کاربری
          maxLength: 150
        first_name:
          type: string
          title: 'نام '
          maxLength: 150
        last_name:
          type: string
          title: نام خانوادگی
          maxLength: 150
        email:
          nullable: true
          title: آدرس ایمیل
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
    PoemTypeEnum:
      enum:
      - ghazal
      - masnavi
      - robaee
      - ghasideh
      - nimaee
      - sepid
      type: string
      description: |-
        * `ghazal` - غزل
        * `masnavi` - مثنوی
        * `robaee` - رباعی
        * `ghasideh` - قصیده
        * `nimaee` - نیمایی
        * `sepid` - سپید
    StatusEnum:
      enum:
      - w
      - a
      - r
      type: string
      description: |-
        * `w` - در انتظار تأیید
        * `a` - تایید شده
        * `r` - ردشده
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
