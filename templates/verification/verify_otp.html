{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Enter OTP" %}{% endblock title %}

{% block content %}
<div class="main-wrapper">
    <div class="poem-card" style="opacity:1; transform:none; max-width:500px; margin:0 auto; text-align:center;">
        <div class="card-accent"></div>
        <h3 class="hero-title" style="font-size:2rem;">{% trans "Enter OTP" %}</h3>
        <p style="color:#f5e7d3;">{% trans "Enter the 6-digit code sent to your email." %}</p>
        <form method="post">
            {% csrf_token %}
            <input type="text" name="otp" maxlength="6" class="form-control" style="font-size:1.5rem; text-align:center; background:rgba(255,255,255,0.1); color:#fff; border:1px solid var(--gold-light);">
            <button type="submit" class="btn-submit mt-3">{% trans "Verify OTP" %}</button>
        </form>
    </div>
</div>
{% endblock %}
