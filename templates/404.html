{% extends "base.html" %}
{% load i18n static %}

{% block title %}{% trans "Page Not Found" %}{% endblock %}

{% block content %}
<article class="poem-card revealed" style="max-width: 500px; margin: 2rem auto; text-align: center;">
    <div class="card-accent"></div>
    <span class="poem-number">404</span>
    <h2 class="poem-detail-title mt-4">{% trans "Page Not Found" %}</h2>
    <div class="poem-text-wrapper">
        <p class="poem-text" style="font-size:1.1rem;">
            {% trans "The page you are looking for does not exist." %}
        </p>
    </div>
    <div class="mt-4">
        <a href="{% url 'MakePoem:home' %}" class="btn btn-warning">{% trans "Return Home" %}</a>
    </div>
</article>
{% endblock %}
